<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio | Visor Interactivo</title>
    <link rel="stylesheet" href="style.css?v=20261116-zoom-fix">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="data.js?v=20261112-week11-refresh"></script>
</head>
<body>
    <div class="bg-blob"></div>

    <a class="site-brand" href="index.html" aria-label="Portafolio académico UPLA, ir al inicio">
        <img src="img/logoupla.png" alt="Logo de la Universidad Peruana Los Andes">
        <span><strong>PORTAFOLIO</strong><small>UNIVERSITARIO</small></span>
    </a>

    <div class="visor-page" id="visorContainer">
        
        <div class="visor-controls">
            <button onclick="history.back()" class="visor-btn" title="Volver a la evidencia"><i class="ph ph-caret-left"></i> Volver</button>
            <div class="visor-title" id="visorTitle">Cargando Documento...</div>
            <button onclick="downloadVisorFile()" class="visor-btn-primary" id="visorDownloadBtn" style="display:none;"><i class="ph ph-download-simple"></i> Guardar Archivo</button>
        </div>

        <div class="visor-card">
            <iframe id="visorFrame" class="visor-frame" src=""></iframe>
            <div id="visorImageViewer" class="visor-image-viewer" style="display:none;">
                <div class="visor-image-controls" aria-label="Controles de zoom de imagen">
                    <button class="visor-image-btn" id="visorZoomOut" type="button" aria-label="Reducir imagen" title="Reducir">
                        <i class="ph ph-minus"></i>
                    </button>
                    <output id="visorZoomLevel" class="visor-zoom-level" aria-live="polite">100%</output>
                    <button class="visor-image-btn" id="visorZoomIn" type="button" aria-label="Agrandar imagen" title="Agrandar">
                        <i class="ph ph-plus"></i>
                    </button>
                    <button class="visor-image-btn visor-image-reset" id="visorZoomReset" type="button">Ajustar</button>
                </div>
                <div id="visorImageStage" class="visor-image-stage">
                    <img id="visorImage" alt="">
                </div>
            </div>
            <div id="visorError" class="visor-error" style="display:none;">
                <i class="ph ph-warning-circle" style="font-size:4rem; margin-bottom:1rem; color:var(--warning)"></i>
                <p style="font-size:1.1rem; max-width:400px; line-height:1.5;">El archivo para esta evidencia aún no está listo o es estrictamente local.</p>
            </div>
        </div>
    </div>

    <button class="theme-toggle" id="themeToggle"><i class="ph ph-sun"></i></button>
    <script src="script.js?v=20261116-zoom-fix"></script>
    <script src="chatbot.js?v=20261112-week11-refresh"></script>
</body>
</html>
